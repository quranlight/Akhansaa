<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحضير حلقة الشيماء بنت الحارث</title>
<style>
:root{--bg:#eef4f6;--card:#fff;--ink:#16303b;--mut:#5d7480;--pri:#1d5a73;--pri2:#e0edf2;--bd:#cfdde3;--warn:#b3261e;--amb:#a8821a;--gold:#c9a22b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2530;--card:#15394a;--ink:#e6f0f4;--mut:#9db6c2;--pri:#3f93b3;--pri2:#1f4a5e;--bd:#2b5469;--warn:#ff8a80;--amb:#e0b840;--gold:#e0b840}}
:root[data-theme="dark"]{--bg:#0e2530;--card:#15394a;--ink:#e6f0f4;--mut:#9db6c2;--pri:#3f93b3;--pri2:#1f4a5e;--bd:#2b5469;--warn:#ff8a80;--amb:#e0b840;--gold:#e0b840}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px;color:var(--pri)}
.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:1.1rem;margin:0 0 12px}
label{display:block;font-weight:600;margin:10px 0 4px}
select,input[type=text],input[type=password],textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;background:var(--pri);color:#fff;font-weight:700}
button.sec{background:var(--pri2);color:var(--pri)}
button.x{background:transparent;color:var(--warn);padding:2px 8px}
.msg{margin-top:10px;font-weight:600}.ok{color:var(--pri)}.err{color:var(--warn)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.row button{flex:none;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:var(--pri2);border-radius:99px;padding:2px 12px;font-size:.9rem}
.ar{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0;background:var(--bg)}
.nm{font-weight:700}
.seg{display:flex;gap:6px;margin-top:6px}
.sg{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--bd);padding:9px 6px;font-weight:600}
.sg.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sg.ex.on{background:var(--amb);border-color:var(--amb)}
.hint{color:var(--warn);font-size:.8rem}
.per{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}
.per small{color:var(--mut);display:block;margin-top:6px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:center;white-space:nowrap}
th{background:var(--pri2)}td:first-child,th:first-child{text-align:right;position:sticky;right:0;background:var(--card)}
th:first-child{background:var(--pri2)}
.h{color:var(--pri);font-weight:700}.m{color:var(--amb);font-weight:700}.a{color:var(--warn);font-weight:700}
.leg{color:var(--mut);font-size:.85rem;margin-top:8px}
.big{flex:1;padding:18px 8px;font-size:1.05rem}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--gold);padding:4px 0 10px;margin-bottom:16px}
.hd h1{margin:0;font-size:1.25rem}
.lg{height:62px;width:auto;flex:none;border-radius:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg{background:#fff;border-radius:12px;padding:4px}}
:root[data-theme="dark"] .lg{background:#fff;border-radius:12px;padding:4px}
.vs{display:flex;flex-direction:column;gap:12px}
.big{display:flex;flex-direction:column;align-items:center;gap:2px;padding:22px 12px;font-size:1.15rem;width:100%}
.ic{font-size:2.2rem;line-height:1.2}
.seg.col{flex-direction:column}
canvas{display:block;width:100%;height:auto;border-radius:14px}
</style>
</head>

const hf = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric"});
const hij = d => { const o = {}; hf.formatToParts(d).forEach(p => { if (p.type==="day"||p.type==="month"||p.type==="year") o[p.type] = parseInt(p.value); }); return o; };
const iso = d => d.toLocaleDateString("en-CA");
const dt12 = s => new Date(s + "T12:00:00");

const pk = (y,m,d) => y*10000 + m*100 + d;

function buildDays() {
  const out = [], t = Date.now();
  for (let i = -300; i <= 400; i++) {
    const x = new Date(t + i*864e5);
    if (x.getDay() > 3) continue;
    const h = hij(x), k = pk(h.year,h.month,h.day);
    for (let j = 0; j < periods.length; j++) {
      const p = periods[j];
      if (k >= pk(p.fy,p.fm,p.fd) && k <= pk(p.ty,p.tm,p.td)) { out.push({d: iso(x), p: j}); break; }
    }
  }
  return out;
}

function fillDays(s) {
  const cur = s.value, td = iso(new Date());
  s.textContent = "";
  days.forEach(x => s.add(new Option(wd(x.d) + " " + hs(x.d) + (x.d === td ? " (اليوم)" : ""), x.d)));
  let pick = "";
  if (cur && days.some(x => x.d === cur)) pick = cur;
  else { const f = days.filter(x => x.d >= td)[0] || days[days.length-1]; pick = f ? f.d : ""; }
  s.value = pick;
}

function tap(s, d, st) {

function repData() {
  const pi = +$("psel").value, td = iso(new Date());
  const ds = days.filter(x => pi < 0 || x.p === pi).map(x => x.d);
  const due = ds.filter(d => d <= td).length;
  const head = [["الطالبة"]].concat(ds.map(d => [wd(d), hshort(d)]), [["حاضرة"],["حضوري"],["عن بعد"],["بعذر"],["بدون عذر"],["الحضور"]]);
  const rows = students.map(s => {
    let pr = 0, inn = 0, rem = 0, ex = 0, ab = 0;
    const cells = ds.map(d => {
      const r = recs[s.id + "_" + d];
      if (r && r.status === "present") { pr++; if (r.mode === "in") { inn++; return "ح"; } if (r.mode === "remote") { rem++; return "ب"; } return "؟"; }
      if (r && r.status === "excused") { ex++; return "ع"; }
      if (d <= td) { ab++; return "غ"; }
      return "";
    });
    return [s.name].concat(cells, [pr, inn, rem, ex, ab, due ? Math.round(pr/due*100) + "%" : "—"]);
  });
  const title = "تحضير حلقة " + HNAME + (pi < 0 ? "" : ": " + plabel(periods[pi]));
  return {head, rows, title, ds};
}

function weeks() {
  const m = {};
  days.forEach(x => { const d = dt12(x.d); d.setDate(d.getDate() - d.getDay()); const k = iso(d); (m[k] = m[k] || []).push(x.d); });
  return Object.keys(m).sort().map(k => ({k, ds: m[k].sort()}));
}
function renderWeeks() {
  const sl = $("wk"), cur = sl.value, W = weeks(), td = iso(new Date());
  sl.textContent = "";
  W.forEach(w => sl.add(new Option("من " + hshort(w.ds[0]) + " إلى " + hs(w.ds[w.ds.length-1]), w.k)));
  const past = W.filter(w => w.ds[0] <= td);
  sl.value = cur && W.some(w => w.k === cur) ? cur : (past.length ? past[past.length-1].k : (W[0] ? W[0].k : ""));
  renderShare();
}
function weekData() {
  const w = weeks().filter(x => x.k === $("wk").value)[0];
  if (!w) return {rows:[], due:0, range:""};
  const td = iso(new Date()), due = w.ds.filter(d => d <= td).length || w.ds.length;
  const rows = students.map(s => ({n:s.name, c:w.ds.filter(d => (recs[s.id + "_" + d] || {}).status === "present").length}))
    .filter(r => r.c > 0).sort((a, b) => b.c - a.c || a.n.localeCompare(b.n, "ar")).slice(0, 5);
  return {rows, due, range:"من " + hshort(w.ds[0]) + " إلى " + hs(w.ds[w.ds.length-1])};
}
function renderShare() { if (view === "app") poster($("pv"), weekData()); }
function renderFeat() {
  const on = !!(feat && feat.on);
  $("fcard").hidden = !(on && view === "home");
  if (on) poster($("fv"), feat);
  $("pub").textContent = on ? "تحديث بهذا الأسبوع" : "إظهار في واجهة الدخول";
  $("unpub").hidden = !on;
  renderShare();
}
function fmsg(t, c) { const m = $("fmsg"); m.textContent = t; m.className = "msg " + c; }
const blobOf = () => new Promise(r => $("pv").toBlob(r, "image/png"));
$("dl").onclick = async () => { const b = await blobOf(), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "muwazaba.png"; a.click(); };
$("shr").onclick = async () => {
  const b = await blobOf(), f = new File([b], "muwazaba.png", {type:"image/png"});
  if (navigator.canShare && navigator.canShare({files:[f]})) { try { await navigator.share({files:[f], title:"الأكثر مواظبة هذا الأسبوع"}); } catch (e) {} } else $("dl").onclick();
};
$("wk").onchange = renderShare;
$("pub").onclick = () => {
  const D = weekData();
  if (!D.rows.length) return fmsg("لا توجد سجلات حضور لهذا الأسبوع", "err");
  setDoc(doc(fdb,"att_settings","featured"), {on:true, rows:D.rows, due:D.due, range:D.range}).then(() => fmsg("ظهرت في واجهة الدخول", "ok")).catch(() => fmsg("تعذّر النشر", "err"));
};
$("unpub").onclick = () => setDoc(doc(fdb,"att_settings","featured"), {on:false}).then(() => fmsg("تم الإخفاء من واجهة الدخول", "ok")).catch(() => fmsg("تعذّر الإخفاء", "err"));
listenPub(); renderS();

$("loginBtn").onclick = () => {
  $("lmsg").textContent = "";
  signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value).catch(() => { $("lmsg").textContent = "البريد أو كلمة المرور غير صحيحة"; });
};
$("logout").onclick = () => signOut(auth);
$("dsel").onchange = renderAtt;
$("psel").onchange = renderRep;
$("pdf").onclick = pdf; $("xl").onclick = excel;
$("add").onclick = () => {
  const names = $("newn").value.split("\n").map(x => x.trim()).filter(Boolean);
  if (!names.length) return;
  Promise.all(names.map(n => addDoc(collection(fdb,"att_students"), {name:n, halaqa:HID})))
    .then(() => { $("newn").value = ""; }).catch(() => alert("تعذّرت الإضافة"));
};
$("addp").onclick = () => { const l = draft[draft.length-1] || DEF[1]; draft.push({...l}); renderPeriods(); };
$("savep").onclick = () => {
  const bad = draft.some(p => pk(p.fy,p.fm,p.fd) > pk(p.ty,p.tm,p.td));
  const m = $("pmsg");
  if (bad) { m.textContent = "تاريخ البداية بعد النهاية في إحدى الفترات"; m.className = "msg err"; return; }
  setDoc(doc(fdb,"att_settings","periods"), {list: draft, halaqa: HID})
    .then(() => { m.textContent = "تم حفظ الفترات"; m.className = "msg ok"; })
    .catch(() => { m.textContent = "تعذّر الحفظ"; m.className = "msg err"; });
};
</script>
