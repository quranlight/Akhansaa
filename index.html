<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحضير حلقة الشيماء بنت الحارث</title>
<style>
:root{--bg:#eef4f6;--card:#fff;--ink:#16303b;--mut:#5d7480;--pri:#1d5a73;--pri2:#e0edf2;--bd:#cfdde3;--warn:#b3261e;--amb:#a8821a;--gold:#c9a22b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2530;--card:#15394a;--ink:#e6f0f4;--mut:#9db6c2;--pri:#3f93b3;--pri2:#1f4a5e;--bd:#2b5469;--warn:#ff8a80;--amb:#e0b840;--gold:#e0b840}}
:root[data-theme="dark"]{--bg:#0e2530;--card:#15394a;--ink:#e6f0f4;--mut:#9db6c2;--pri:#3f93b3;--pri2:#1f4a5e;--bd:#2b5469;--warn:#ff8a80;--amb:#e0b840;--gold:#e0b840}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px;color:var(--pri)}
.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:1.1rem;margin:0 0 12px}
label{display:block;font-weight:600;margin:10px 0 4px}
select,input[type=text],input[type=password],textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;background:var(--pri);color:#fff;font-weight:700}
button.sec{background:var(--pri2);color:var(--pri)}
button.x{background:transparent;color:var(--warn);padding:2px 8px}
.msg{margin-top:10px;font-weight:600}.ok{color:var(--pri)}.err{color:var(--warn)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.row button{flex:none;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:var(--pri2);border-radius:99px;padding:2px 12px;font-size:.9rem}
.ar{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0;background:var(--bg)}
.nm{font-weight:700}
.seg{display:flex;gap:6px;margin-top:6px}
.sg{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--bd);padding:9px 6px;font-weight:600}
.sg.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sg.ex.on{background:var(--amb);border-color:var(--amb)}
.hint{color:var(--warn);font-size:.8rem}
.per{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}
.per small{color:var(--mut);display:block;margin-top:6px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:center;white-space:nowrap}
th{background:var(--pri2)}td:first-child,th:first-child{text-align:right;position:sticky;right:0;background:var(--card)}
th:first-child{background:var(--pri2)}
.h{color:var(--pri);font-weight:700}.m{color:var(--amb);font-weight:700}.a{color:var(--warn);font-weight:700}
.leg{color:var(--mut);font-size:.85rem;margin-top:8px}
.big{flex:1;padding:18px 8px;font-size:1.05rem}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--gold);padding:4px 0 10px;margin-bottom:16px}
.hd h1{margin:0;font-size:1.25rem}
.lg{height:62px;width:auto;flex:none;border-radius:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg{background:#fff;border-radius:12px;padding:4px}}
:root[data-theme="dark"] .lg{background:#fff;border-radius:12px;padding:4px}
.vs{display:flex;flex-direction:column;gap:12px}
.big{display:flex;flex-direction:column;align-items:center;gap:2px;padding:22px 12px;font-size:1.15rem;width:100%}
.ic{font-size:2.2rem;line-height:1.2}
.seg.col{flex-direction:column}
canvas{display:block;width:100%;height:auto;border-radius:14px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw .c{width:42px;height:42px;border-radius:50%;padding:0;border:3px solid transparent}
.sw .c.on{border-color:var(--ink)}
.nl{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:240px;overflow:auto}
.nl label,.chkl{display:flex;align-items:center;gap:8px;margin:0;font-weight:500;padding:6px 8px;border:1px solid var(--bd);border-radius:8px}
.nl input,.chkl input{width:18px;height:18px;accent-color:var(--pri)}
img.fi{width:100%;border-radius:14px;display:block;margin-bottom:10px}
</style>
</head>

const HID = "shaymaa", HNAME = "الشيماء بنت الحارث";
const DEF = [
  {fy:1448,fm:5,fd:28,ty:1448,tm:6,td:8},
  {fy:1448,fm:6,fd:20,ty:1448,tm:7,td:7}
];
const $ = i => document.getElementById(i);
const HM = ["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
const hf = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric"});
const hij = d => { const o = {}; hf.formatToParts(d).forEach(p => { if (p.type==="day"||p.type==="month"||p.type==="year") o[p.type] = parseInt(p.value); }); return o; };
const iso = d => d.toLocaleDateString("en-CA");
const dt12 = s => new Date(s + "T12:00:00");
const hs = s => { const h = hij(dt12(s)); return h.day + " " + HM[h.month-1] + " " + h.year + "هـ"; };
const hshort = s => { const h = hij(dt12(s)); return h.day + " " + HM[h.month-1]; };
const wd = s => dt12(s).toLocaleDateString("ar",{weekday:"long"});
const pk = (y,m,d) => y*10000 + m*100 + d;
const plabel = p => p.fd + " " + HM[p.fm-1] + " إلى " + p.td + " " + HM[p.tm-1] + " " + p.ty + "هـ";

const S = {st:null, mo:null};
let view = "home", feat = {att:null, star:null};
let students = [], recs = {}, periods = DEF.map(p => ({...p})), draft = [], days = [], unsubs = [];

function buildDays() {
  const out = [], t = Date.now();
  for (let i = -300; i <= 400; i++) {
    const x = new Date(t + i*864e5);
    if (x.getDay() > 3) continue;
    const h = hij(x), k = pk(h.year,h.month,h.day);
    for (let j = 0; j < periods.length; j++) {
      const p = periods[j];
      if (k >= pk(p.fy,p.fm,p.fd) && k <= pk(p.ty,p.tm,p.td)) { out.push({d: iso(x), p: j}); break; }
    }
  }
  return out;
}

function fillDays(s) {
  const cur = s.value, td = iso(new Date());
  s.textContent = "";
  days.forEach(x => s.add(new Option(wd(x.d) + " " + hs(x.d) + (x.d === td ? " (اليوم)" : ""), x.d)));
  let pick = "";
  if (cur && days.some(x => x.d === cur)) pick = cur;
  else { const f = days.filter(x => x.d >= td)[0] || days[days.length-1]; pick = f ? f.d : ""; }
  s.value = pick;
}
function renderDays() {
  fillDays($("dsel")); fillDays($("sd")); loadS();
  const ps = $("psel"), pc = ps.value;
  ps.textContent = "";
  ps.add(new Option("كل الفترات", -1));
  periods.forEach((p,i) => ps.add(new Option(plabel(p), i)));
  ps.value = pc && ps.querySelector('option[value="' + pc + '"]') ? pc : -1;
}

const fail = () => { $("amsg").textContent = "تعذّر الحفظ، تأكدي من الاتصال وحاولي مرة أخرى"; };
function save(s, d, p) {
  $("amsg").textContent = "";
  return setDoc(doc(fdb,"att_records",s.id + "_" + d), {studentId:s.id, name:s.name, date:d, halaqa:HID, ...p}).catch(fail);
}
function tap(s, d, st) {
  const id = s.id + "_" + d, r = recs[id];
  if (r && r.status === st) return deleteDoc(doc(fdb,"att_records",id)).catch(fail);
  return save(s, d, {status: st, mode: st === "present" ? ((r && r.mode) || null) : null});
}
function setMode(s, d, m) {
  const r = recs[s.id + "_" + d] || {};
  save(s, d, {status:"present", mode: r.mode === m ? null : m});
}
function btn(t, on, f, c) {
  const b = document.createElement("button");
  b.className = "sg " + (c || "") + (on ? " on" : "");
  b.textContent = t; b.onclick = f; return b;
}

function renderAtt() {
  const box = $("al"), d = $("dsel").value;
  box.textContent = ""; $("cnt").textContent = "";
  if (!d) { box.textContent = "لا توجد أيام دوام، عدّلي فترات الدوام"; return; }
  if (!students.length) { box.textContent = "أضيفي الطالبات أولاً"; return; }
  let n = 0;
  students.forEach(s => {
    const r = recs[s.id + "_" + d] || {};
    if (r.status) n++;
    const row = document.createElement("div"); row.className = "ar";
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = s.name; row.appendChild(nm);
    const g = document.createElement("div"); g.className = "seg";
    g.appendChild(btn("حاضرة", r.status === "present", () => tap(s, d, "present")));
    g.appendChild(btn("غائبة بعذر", r.status === "excused", () => tap(s, d, "excused"), "ex"));
    row.appendChild(g);
    if (r.status === "present") {
      const g2 = document.createElement("div"); g2.className = "seg";
      g2.appendChild(btn("حضوري", r.mode === "in", () => setMode(s, d, "in")));
      g2.appendChild(btn("عن بعد", r.mode === "remote", () => setMode(s, d, "remote")));
      row.appendChild(g2);
      if (!r.mode) { const h = document.createElement("div"); h.className = "hint"; h.textContent = "حددي نوع التسميع"; row.appendChild(h); }
    }
    box.appendChild(row);
  });
  $("cnt").textContent = "تم تحضير " + n + " من " + students.length + " (الطالبة بلا تسجيل تُحسب غائبة بدون عذر)";
}

function repData() {
  const pi = +$("psel").value, td = iso(new Date());
  const ds = days.filter(x => pi < 0 || x.p === pi).map(x => x.d);
  const due = ds.filter(d => d <= td).length;
  const head = [["الطالبة"]].concat(ds.map(d => [wd(d), hshort(d)]), [["حاضرة"],["حضوري"],["عن بعد"],["بعذر"],["بدون عذر"],["الحضور"]]);
  const rows = students.map(s => {
    let pr = 0, inn = 0, rem = 0, ex = 0, ab = 0;
    const cells = ds.map(d => {
      const r = recs[s.id + "_" + d];
      if (r && r.status === "present") { pr++; if (r.mode === "in") { inn++; return "ح"; } if (r.mode === "remote") { rem++; return "ب"; } return "؟"; }
      if (r && r.status === "excused") { ex++; return "ع"; }
      if (d <= td) { ab++; return "غ"; }
      return "";
    });
    return [s.name].concat(cells, [pr, inn, rem, ex, ab, due ? Math.round(pr/due*100) + "%" : "—"]);
  });
  const title = "تحضير حلقة " + HNAME + (pi < 0 ? "" : ": " + plabel(periods[pi]));
  return {head, rows, title, ds};
}
const SYM = {"ح":"h","ب":"m","ع":"m","غ":"a","؟":"a"};
function renderRep() {
  const t = $("t"); t.textContent = "";
  const D = repData();
  const hr = document.createElement("tr");
  D.head.forEach(h => { const th = document.createElement("th"); th.textContent = h[0]; if (h[1]) { th.appendChild(document.createElement("br")); const sm = document.createElement("small"); sm.textContent = h[1]; th.appendChild(sm); } hr.appendChild(th); });
  t.appendChild(hr);
  D.rows.forEach(r => {
    const tr = document.createElement("tr");
    r.forEach(v => { const td = document.createElement("td"); td.textContent = v; if (SYM[v]) td.className = SYM[v]; tr.appendChild(td); });
    t.appendChild(tr);
  });
}
function pdf() {
  const D = repData(), w = window.open("", "_blank");
  if (!w) { alert("اسمحي للنوافذ المنبثقة ثم أعيدي المحاولة"); return; }
  const fs = D.ds.length > 16 ? 7 : D.ds.length > 10 ? 8 : 10;
  w.document.write('<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>' + D.title + '</title><style>@page{size:A4 portrait;margin:10mm}body{font-family:Tahoma,Arial,sans-serif;color:#111;margin:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top img{width:130px;height:auto}h1{font-size:15px;color:#1f6b4f;margin:0}table{border-collapse:collapse;width:100%;table-layout:auto}th,td{border:1px solid #bbb;padding:3px 2px;text-align:center;font-size:' + fs + 'px}th{background:#e3f1ea}td:first-child{text-align:right;white-space:nowrap}small{display:block;color:#555;font-size:' + (fs-1) + 'px}p{font-size:10px}</style></head><body><div class="top"><h1>' + D.title + '</h1><img src="' + $("logo").src + '"></div>' + $("t").outerHTML + '<p>ح = حاضرة حضوري، ب = حاضرة عن بعد، ع = غائبة بعذر، غ = غائبة بدون عذر، ؟ = حاضرة بدون تحديد نوع التسميع</p></body></html>');
  w.document.close(); setTimeout(() => w.print(), 700);
}
function excel() {
  if (!window.XLSX) { alert("تعذّر تحميل مكتبة Excel، تأكدي من الإنترنت وأعيدي المحاولة"); return; }
  const D = repData();
  const ws = XLSX.utils.aoa_to_sheet([[D.title], [], D.head.map(h => h.join(" "))].concat(D.rows));
  ws["!cols"] = [{wch:22}].concat(D.head.slice(1).map(() => ({wch:14})));
  const wb = XLSX.utils.book_new(); wb.Workbook = {Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb, ws, "تحضير");
  XLSX.writeFile(wb, "tahdeer-" + HID + ".xlsx");
}

function renderStudents() {
  const sel = $("snm"), cur = sel.value; sel.textContent = ""; sel.add(new Option("اختاري اسمك…", ""));
  students.forEach(x => sel.add(new Option(x.name, x.id))); sel.value = cur;
  const tg = $("tags"); tg.textContent = "";
  students.forEach(s => {
    const sp = document.createElement("span"); sp.className = "tag"; sp.textContent = s.name;
    const b = document.createElement("button"); b.className = "x"; b.textContent = "✕"; b.title = "حذف";
    b.onclick = () => { if (confirm("حذف " + s.name + " من القائمة؟ (سجلاتها تبقى)")) deleteDoc(doc(fdb,"att_students",s.id)).catch(() => {}); };
    sp.appendChild(b); tg.appendChild(sp);
  });
}

function mk(opts, val, f) {
  const s = document.createElement("select");
  opts.forEach(o => s.add(new Option(o[1], o[0])));
  s.value = val; s.onchange = () => f(+s.value); return s;
}
function renderPeriods() {
  const box = $("pl"); box.textContent = "";
  const cy = hij(new Date()).year;
  const D = Array.from({length:30}, (_,i) => [i+1, i+1]);
  const M = HM.map((n,i) => [i+1, n]);
  const Y = [cy-1, cy, cy+1, cy+2].map(y => [y, y]);
  draft.forEach((p, i) => {
    const c = document.createElement("div"); c.className = "per";
    const head = document.createElement("div"); head.className = "row";
    const t = document.createElement("b"); t.textContent = "الفترة " + (i+1);
    const rm = document.createElement("button"); rm.className = "x"; rm.textContent = "حذف";
    rm.onclick = () => { draft.splice(i,1); renderPeriods(); };
    head.appendChild(t); head.appendChild(rm); c.appendChild(head);
    [["من","f"],["إلى","t"]].forEach(([lb,k]) => {
      const l = document.createElement("small"); l.textContent = lb; c.appendChild(l);
      const r = document.createElement("div"); r.className = "row";
      r.appendChild(mk(D, p[k+"d"], v => p[k+"d"] = v));
      r.appendChild(mk(M, p[k+"m"], v => p[k+"m"] = v));
      r.appendChild(mk(Y, p[k+"y"], v => p[k+"y"] = v));
      c.appendChild(r);
    });
    box.appendChild(c);
  });
}

function refresh() { days = buildDays(); renderDays(); renderAtt(); renderRep(); renderWeeks(); }

function listenPub() {
  onSnapshot(query(collection(fdb,"att_students"), where("halaqa","==",HID)), sn => {
    students = sn.docs.map(d => ({id:d.id, name:d.data().name})).sort((a,b) => a.name.localeCompare(b.name,"ar"));
    renderStudents(); renderAtt(); renderRep(); loadS(); renderShare();
  }, () => {});
  ["att","star"].forEach(k => onSnapshot(doc(fdb,"att_settings","feat_" + k), sn => { feat[k] = sn.exists() ? sn.data() : null; renderFeat(); }, () => {}));
  onSnapshot(doc(fdb,"att_settings","periods"), sn => {
    const l = sn.exists() && sn.data().list;
    periods = l && l.length ? l : DEF.map(p => ({...p}));
    draft = periods.map(p => ({...p}));
    renderPeriods(); refresh();
  }, () => {});
}
function listenT() {
  unsubs.push(onSnapshot(query(collection(fdb,"att_records"), where("halaqa","==",HID)), sn => {
    recs = {}; sn.docs.forEach(d => { recs[d.id] = d.data(); });
    renderAtt(); renderRep(); renderShare();
  }, () => {}));
}
function show(v) { ["home","stu","login","app"].forEach(i => { $(i).hidden = i !== v; }); view = v; renderFeat(); }
onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = [];
  if (u) { listenT(); show("app"); }
  else { recs = {}; if (view === "app") show("home"); renderAtt(); renderRep(); }
});

function renderS() {
  const a = $("sb"), b = $("sm"); a.textContent = ""; b.textContent = "";
  a.appendChild(btn("حاضرة", S.st === "present", () => { S.st = "present"; renderS(); }));
  a.appendChild(btn("غائبة بعذر", S.st === "excused", () => { S.st = "excused"; S.mo = null; renderS(); }, "ex"));
  $("smw").hidden = S.st !== "present";
  b.appendChild(btn("حضوري", S.mo === "in", () => { S.mo = "in"; renderS(); }));
  b.appendChild(btn("عن بعد", S.mo === "remote", () => { S.mo = "remote"; renderS(); }));
}
async function loadS() {
  const id = $("snm").value, d = $("sd").value;
  S.st = null; S.mo = null; $("smsg").textContent = "";
  if (id && d) { try { const r = await getDoc(doc(fdb,"att_records",id + "_" + d)); if (r.exists()) { S.st = r.data().status; S.mo = r.data().mode || null; } } catch (e) {} }
  renderS();
}
function smsg(t, c) { const m = $("smsg"); m.textContent = t; m.className = "msg " + c; }
$("snm").onchange = loadS; $("sd").onchange = loadS;
$("goS").onclick = () => show("stu");
$("goT").onclick = () => show(auth.currentUser ? "app" : "login");
$("backS").onclick = () => show("home"); $("backT").onclick = () => show("home");
$("ssend").onclick = () => {
  const id = $("snm").value, d = $("sd").value, st = students.filter(x => x.id === id)[0];
  if (!st) return smsg("اختاري اسمك أولاً", "err");
  if (!d) return smsg("لا توجد أيام دوام", "err");
  if (!S.st) return smsg("اختاري حاضرة أو غائبة بعذر", "err");
  if (S.st === "present" && !S.mo) return smsg("اختاري نوع التسميع: حضوري أو عن بعد", "err");
  $("ssend").disabled = true;
  setDoc(doc(fdb,"att_records",id + "_" + d), {studentId:id, name:st.name, date:d, halaqa:HID, status:S.st, mode:S.st === "present" ? S.mo : null})
    .then(() => smsg("تم التسجيل، بارك الله فيك ✨", "ok"))
    .catch(() => smsg("تعذّر التسجيل، حاولي مرة أخرى", "err"))
    .then(() => { $("ssend").disabled = false; });

const P = {kind:"att", ds:0, own:null, manual:{}};
const FONT = "Tahoma,'Noto Naskh Arabic',Arial,sans-serif";
function fit(c, t, w, px, wt) { let z = px; do { c.font = wt + " " + z + "px " + FONT; z -= 2; } while (c.measureText(t).width > w && z > 14); }
function cover(c, im) { const r = Math.max(1080/im.width, 1920/im.height), w = im.width*r, h = im.height*r; c.drawImage(im, (1080-w)/2, (1920-h)/2, w, h); }
function weeks() {
  const m = {};

const title = () => $("ttl").value.trim() || KD[P.kind];

  names.forEach((nm, i) => {
    const ci = Math.floor(i / rows), ri = i % rows, cx = 940 - cw * (ci + .5), y = top + rh * ri + rh / 2;
    c.fillStyle = col; fit(c, nm, cw - 40, Math.min(54, rh * .52), "bold"); c.fillText(nm, cx, y + 16);
  });
}
function renderNames() {
  const box = $("nl"), ch = chosen(); box.textContent = "";
  students.forEach(s => {
    const l = document.createElement("label"), c = document.createElement("input"); c.type = "checkbox"; c.checked = ch.indexOf(s.id) >= 0;
    c.onchange = () => { const cur = chosen().filter(x => x !== s.id); if (c.checked) cur.push(s.id); P.manual[selKey()] = cur; drawNow(); };
    l.appendChild(c); l.appendChild(document.createTextNode(s.name)); box.appendChild(l);
  });
}
function renderShare() { if (view !== "app") return; renderNames(); drawNow(); }
function renderSw() {
  const b = $("sw"); b.textContent = "";
  DS.forEach((d, i) => { const x = document.createElement("button"); x.className = "c" + (P.ds === i ? " on" : ""); x.style.background = d.c; x.title = d.n; x.onclick = () => { P.ds = i; renderSw(); drawNow(); }; b.appendChild(x); });
  const o = document.createElement("button"); o.className = "sec" + (P.ds < 0 ? " on" : ""); o.textContent = P.own ? "صورتي ✓" : "+ صورتي"; o.onclick = () => $("fi").click(); b.appendChild(o);
  $("oww").hidden = P.ds >= 0;
}
function renderKind() {
  const b = $("kd"); b.textContent = "";
  [["att","المواظبات"],["star","المتميزات"]].forEach(k => b.appendChild(btn(k[1], P.kind === k[0], () => { P.kind = k[0]; $("ttl").value = KD[k[0]]; $("wkw").hidden = k[0] !== "att"; $("rst").hidden = k[0] !== "att"; renderKind(); renderShare(); renderFeat(); })));
}
function renderFeat() {
  const box = $("fimgs"); box.textContent = "";
  const on = ["att","star"].filter(k => feat[k] && feat[k].on && feat[k].img);
  on.forEach(k => { const im = document.createElement("img"); im.className = "fi"; im.alt = KD[k]; im.src = feat[k].img; box.appendChild(im); });
  $("fcard").hidden = !(on.length && view === "home");
  const cur = feat[P.kind] && feat[P.kind].on;
  $("pub").textContent = cur ? "تحديث الصورة في واجهة الدخول" : "إظهار في واجهة الدخول";
  $("unpub").hidden = !cur;
}
function fmsg(t, c) { const m = $("fmsg"); m.textContent = t; m.className = "msg " + c; }
const blobOf = () => new Promise(r => $("pv").toBlob(r, "image/jpeg", .92));
$("dl").onclick = async () => { const b = await blobOf(), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = P.kind + ".jpg"; a.click(); };
$("shr").onclick = async () => {
  const b = await blobOf(), f = new File([b], P.kind + ".jpg", {type:"image/jpeg"});
  if (navigator.canShare && navigator.canShare({files:[f]})) { try { await navigator.share({files:[f], title:title()}); } catch (e) {} } else $("dl").onclick();
};
$("wk").onchange = renderShare; $("ttl").oninput = drawNow; $("ow").onchange = drawNow;
$("fi").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image(); im.onload = () => { P.own = im; P.ds = -1; renderSw(); drawNow(); }; im.src = URL.createObjectURL(f);
};
$("pub").onclick = () => {
  const bare = P.ds < 0 && !$("ow").checked;
  if (P.ds < 0 && !P.own) return fmsg("أضيفي صورتك أولاً", "err");
  if (!bare && !chosen().length) return fmsg("اختاري الطالبات أولاً", "err");
  drawNow();
  let img = $("pv").toDataURL("image/jpeg", .82);
  if (img.length > 900000) img = $("pv").toDataURL("image/jpeg", .6);
  if (img.length > 1000000) return fmsg("الصورة كبيرة جدًا، جرّبي صورة أبسط", "err");
  setDoc(doc(fdb,"att_settings","feat_" + P.kind), {on:true, img}).then(() => fmsg("ظهرت في واجهة الدخول", "ok")).catch(() => fmsg("تعذّر النشر", "err"));
};
$("unpub").onclick = () => setDoc(doc(fdb,"att_settings","feat_" + P.kind), {on:false}).then(() => fmsg("تم الإخفاء من واجهة الدخول", "ok")).catch(() => fmsg("تعذّر الإخفاء", "err"));
$("ttl").value = KD.att; $("rst").onclick = () => { delete P.manual[selKey()]; renderShare(); }; renderSw(); renderKind();
listenPub(); renderS();

$("loginBtn").onclick = () => {
  $("lmsg").textContent = "";
  signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value).catch(e => { $("lmsg").textContent = "تعذّر الدخول: " + (e && e.code ? e.code : e); });
};
$("logout").onclick = () => signOut(auth);
$("dsel").onchange = renderAtt;
$("psel").onchange = renderRep;
$("pdf").onclick = pdf; $("xl").onclick = excel;
$("add").onclick = () => {
  const names = $("newn").value.split("\n").map(x => x.trim()).filter(Boolean);
  if (!names.length) return;
  Promise.all(names.map(n => addDoc(collection(fdb,"att_students"), {name:n, halaqa:HID})))
    .then(() => { $("newn").value = ""; }).catch(() => alert("تعذّرت الإضافة"));
};
$("addp").onclick = () => { const l = draft[draft.length-1] || DEF[1]; draft.push({...l}); renderPeriods(); };
$("savep").onclick = () => {
  const bad = draft.some(p => pk(p.fy,p.fm,p.fd) > pk(p.ty,p.tm,p.td));
  const m = $("pmsg");
  if (bad) { m.textContent = "تاريخ البداية بعد النهاية في إحدى الفترات"; m.className = "msg err"; return; }
  setDoc(doc(fdb,"att_settings","periods"), {list: draft, halaqa: HID})
    .then(() => { m.textContent = "تم حفظ الفترات"; m.className = "msg ok"; })
    .catch(() => { m.textContent = "تعذّر الحفظ"; m.className = "msg err"; });
};
</script>
</body>
